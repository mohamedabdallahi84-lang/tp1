<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Produits</title>
    <style>
        body { font-family: Arial; padding: 30px; background: #f5f5f5; }
        .form-box { background: white; padding: 20px; border-radius: 8px;
                    margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        input { padding: 8px; margin: 5px; border: 1px solid #ddd;
                border-radius: 4px; width: 200px; }
        .card { background: white; padding: 20px; margin: 10px 0;
                border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
                display: flex; justify-content: space-between; align-items: center; }
        .card-actions { display: flex; gap: 10px; }
        .btn { padding: 8px 16px; border: none; border-radius: 6px;
               cursor: pointer; color: white; font-size: 14px; }
        .btn-blue { background: #2196F3; }
        .btn-red { background: #f44336; }
        .btn-green { background: #4CAF50; }
        a { color: #2196F3; text-decoration: none; }
        .modal { display: none; position: fixed; top: 0; left: 0;
                 width: 100%; height: 100%; background: rgba(0,0,0,0.5);
                 justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-box { background: white; padding: 30px;
                     border-radius: 10px; width: 350px; }
    </style>
</head>
<body>
<a th:href="@{/admin}">← Accueil</a>
<h1>⚙️ Gestion des Produits</h1>

<!-- Ajouter -->
<div class="form-box">
    <h3>➕ Ajouter un produit</h3>
    <form th:action="@{/products/admin/add}" method="post">
        <input type="text" name="name" placeholder="Nom" required/>
        <input type="number" name="price" placeholder="Prix" step="0.01" required/>
        <input type="text" name="description" placeholder="Description"/>
        <button type="submit" class="btn btn-green">Ajouter</button>
    </form>
</div>

<!-- Liste -->
<div th:each="product : ${products}" class="card">
    <div>
        <h3 th:text="${product.name}"></h3>
        <p th:text="${product.price} + ' €'"></p>
        <p th:text="${product.description}"></p>
    </div>
    <div class="card-actions">
        <button class="btn btn-blue"
                th:onclick="|openModal('modal-' + ${product.id})|">
            ✏️ Modifier
        </button>
        <form th:action="@{/products/admin/delete/{id}(id=${product.id})}" method="post" style="display:inline">
            <button type="submit">🗑️ Supprimer</button>
        </form>
    </div>
</div>

<!-- Modals -->
<div th:each="product : ${products}"
     th:id="|modal-${product.id}|"
     class="modal">
    <div class="modal-box">
        <h3>✏️ Modifier</h3>
        <form th:action="@{/products/admin/update/{id}(id=${product.id})}"
              method="post">
            <input type="text" name="name"
                   th:value="${product.name}" required/><br/>
            <input type="number" name="price"
                   th:value="${product.price}" step="0.01" required/><br/>
            <input type="text" name="description"
                   th:value="${product.description}"/><br/><br/>
            <button type="submit" class="btn btn-blue">✅ Sauvegarder</button>
            <button type="button" class="btn btn-red"
                    th:onclick="|closeModal('modal-' + ${product.id})|">
                ❌ Annuler
            </button>
        </form>
    </div>
</div>
<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <a th:href="@{/admin}">← Accueil</a>
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn btn-red">🚪 Déconnexion</button>
    </form>
</div>

<script>
    function openModal(id) {
        document.getElementById(id).classList.add('active');
    }
    function closeModal(id) {
        document.getElementById(id).classList.remove('active');
    }
</script>
</body>
</html>
