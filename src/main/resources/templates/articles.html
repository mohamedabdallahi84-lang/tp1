<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Articles</title>
    <style>
        body { font-family: Arial; padding: 30px; background: #f5f5f5; }
        h1 { color: #333; }
        .card { background: white; padding: 20px; margin: 15px 0;
                border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .comment { background: #f9f9f9; padding: 8px 12px; margin: 5px 0;
                   border-left: 3px solid #4CAF50; border-radius: 4px; }
        input { padding: 8px; margin: 5px; border: 1px solid #ddd;
                border-radius: 4px; width: 200px; }
        .btn { padding: 8px 16px; border: none; border-radius: 6px;
               cursor: pointer; color: white; background: #4CAF50; }
        a { color: #2196F3; text-decoration: none; }
    </style>
</head>
<body>
<a th:href="@{/admin}">← Accueil</a>
<h1>📝 Articles</h1>

<div th:each="article : ${articles}" class="card">
    <h3 th:text="${article.title}"></h3>
    <p th:text="${article.content}"></p>

    <h4>💬 Commentaires</h4>
    <div th:if="${#lists.isEmpty(article.comments)}">
        <p style="color:gray;">Aucun commentaire</p>
    </div>
    <div th:each="comment : ${article.comments}" class="comment">
        <strong th:text="${comment.author}"></strong> :
        <span th:text="${comment.text}"></span>
    </div>

    <!-- Formulaire commentaire -->
    <form th:action="@{/articles/{id}/comments(id=${article.id})}" method="post">
        <input type="text" name="author" placeholder="Votre nom" required/>
        <input type="text" name="text" placeholder="Votre commentaire" required/>
        <button type="submit" class="btn">💬 Commenter</button>
    </form>
</div>
</body>
</html>
