<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Connexion</title>
    <style>
        body { font-family: Arial; display: flex; justify-content: center;
               align-items: center; height: 100vh;
               background: #f5f5f5; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 10px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.1);
                width: 300px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 8px 0;
                border: 1px solid #ddd; border-radius: 5px;
                box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #2196F3;
                 color: white; border: none; border-radius: 5px;
                 cursor: pointer; font-size: 16px; }
        button:hover { background: #1976D2; }
        .error { color: red; font-size: 13px; }
        a { color: #2196F3; }
    </style>
</head>
<body>
<div class="card">
    <h2>🔐 Connexion Admin</h2>
    <div th:if="${param.error}" class="error">
        ❌ Identifiants incorrects
    </div>
    <form th:action="@{/login}" method="post">
        <input type="text" name="username" placeholder="Nom d'utilisateur" required/>
        <input type="password" name="password" placeholder="Mot de passe" required/>
        <button type="submit">Se connecter</button>
    </form>
    <br>
    <a th:href="@{/}">← Retour accueil</a>
</div>
</body>
</html>
