<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Produits</title>
    <style>
        body { font-family: Arial; padding: 30px; background: #f5f5f5; }
        h1 { color: #333; }
        .card { background: white; padding: 20px; margin: 10px 0;
                border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .card h3 { margin: 0 0 5px; }
        .card p { margin: 0; color: gray; }
        .price { color: #4CAF50; font-weight: bold; font-size: 18px; }
        a { color: #2196F3; text-decoration: none; }
    </style>
</head>
<body>
<a th:href="@{/}">← Accueil</a>
<h1>📦 Liste des Produits</h1>

<div th:each="product : ${products}" class="card">
    <h3 th:text="${product.name}"></h3>
    <p class="price" th:text="${product.price} + ' €'"></p>
    <p th:text="${product.description}"></p>
</div>
</body>
</html>
